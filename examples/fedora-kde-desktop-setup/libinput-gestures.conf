# 3-finger touchpad swipes -> KDE Plasma / KWin actions
# Generated for Fedora + KDE Plasma 6.7.4 (Wayland)
# Each action calls KWin's already-registered global shortcut over D-Bus,
# so it works identically on X11 and Wayland with no xdotool/wmctrl needed.

gesture swipe up 3    busctl --user call org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component invokeShortcut s "Overview"
gesture swipe down 3  busctl --user call org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component invokeShortcut s "Show Desktop"
gesture swipe left 3  busctl --user call org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component invokeShortcut s "Walk Through Windows (Reverse)"
gesture swipe right 3 busctl --user call org.kde.kglobalaccel /component/kwin org.kde.kglobalaccel.Component invokeShortcut s "Walk Through Windows"
